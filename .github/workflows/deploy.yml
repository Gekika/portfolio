name: Build and deploy

on:
  push:
    branches: [main]        # every push to main...
  workflow_dispatch:        # ...or a manual "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # lets the built-in token push to GHCR
    steps:
      - uses: actions/checkout@v7          # get the code

      - uses: docker/setup-buildx-action@v4   # Docker builder that supports caching

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in, short-lived; no PAT needed

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/gekika/portfolio:latest
            ghcr.io/gekika/portfolio:${{ github.sha }}
          cache-from: type=gha              # reuse layers from the last run
          cache-to: type=gha,mode=max

  deploy:
    needs: build            # only runs if build succeeded
    runs-on: ubuntu-latest
    steps:
      - name: Tell the VPS to pull and restart
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/deploy_key deploy@"$HOST"