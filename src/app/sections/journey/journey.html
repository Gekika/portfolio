<section id="journey" class="mx-auto max-w-6xl px-6 py-28">
  <app-section-title index="02" label="Journey" />

  <ol class="relative mt-12 max-w-3xl border-l border-lilac/20 pl-8">
    @for (m of milestones; track m.title; let last = $last) {
      <li class="relative pb-12 last:pb-0">
        <!-- The dot, centred on the line. The newest one pulses: "you are here" -->
        <span class="absolute top-1.5 -left-[38.5px] flex size-3">
          @if (last) {
            <span class="absolute inline-flex size-full animate-ping rounded-full bg-lilac opacity-60"></span>
          }
          <span class="relative inline-flex size-3 rounded-full bg-lilac"></span>
        </span>

        <p class="font-mono text-xs tracking-widest text-lilac">{{ m.period }}</p>
        <h3 class="mt-2 font-display text-xl font-bold text-paper">{{ m.title }}</h3>
        <p class="text-sm text-haze">{{ m.org }}</p>
        <ul class="mt-3 space-y-2 text-sm leading-relaxed text-haze">
          @for (point of m.points; track point) {
            <li class="flex gap-2"><span class="text-lilac">›</span>{{ point }}</li>
          }
        </ul>
      </li>
    }
  </ol>
</section>
