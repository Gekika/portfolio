server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text files before sending: JS, CSS and JSON shrink ~70-80%
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;   # unknown paths → Angular's router
    }

    # JS/CSS filenames contain a content hash, so a file never changes: cache it for a year
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";  # always fetch the latest, so new deploys show up
    }
}