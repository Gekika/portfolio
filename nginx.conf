server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # unknown paths → Angular's router
    }

    location = /index.html {
        add_header Cache-Control "no-cache"; # always fetch the latest index.html, so new deploys show up
    }
}